site_name: Noobietoria Studio API
site_description: Tài liệu API chính thức của Noobietoria Studio
site_author: Noobietoria Team
docs_dir: docs
site_url: https://noobietoria.github.io/Docs/
theme:
  name: material
  language: vi
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ sáng
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Trang chủ: index.md
  - Instance Reference: instance.md
  - API Reference: api.md
