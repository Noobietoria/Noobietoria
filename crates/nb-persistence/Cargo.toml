[package]
name = "nb-persistence"
description = "Pluggable database + object storage backends for Noobietoria (SQLite/Postgres/MySQL/CockroachDB, local/S3/R2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nb-types.workspace = true
anyhow.workspace = true
async-trait = "0.1"
axum.workspace = true
bytes = "1"
futures-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# Optional backends — enabled via features.
sqlx = { version = "0.8", optional = true, features = ["runtime-tokio-rustls", "migrate", "any", "sqlite"] }
s3 = { version = "0.1", optional = true }

[features]
# Default: in-memory backends only, no SQL driver needed.
default = []
# Enable SQLite persistence (file-based, zero server setup).
sqlite = ["dep:sqlx"]
# Enable "any" database driver (Postgres, MySQL, CockroachDB via sqlx::any).
any-db = ["dep:sqlx"]
# Enable S3/R2-compatible object storage.
s3 = ["dep:s3"]