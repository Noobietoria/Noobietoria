[package]
name = "nb-store"
description = "DataStore and keyed persistent stores with the documented limits enforced."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nb-types.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio.workspace = true
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
# Real database backends supported: SQLite, Postgres, MySQL, CockroachDB
sqlx = { workspace = true, optional = true }

[features]
default = ["sqlx", "storage"]
sqlx = ["dep:sqlx"]
storage = ["dep:reqwest", "dep:sha2", "dep:hex", "dep:hmac"]

