[package]
name = "noobietoria-client"
description = "Noobietoria Client: play published places."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# `cargo run -p noobietoria-client` must pick the app, not the dev-only ui-shot.
default-run = "noobietoria-client"

[lib]
name = "noobietoria_client"
path = "src/lib.rs"

[[bin]]
name = "noobietoria-client"
path = "src/main.rs"

# Dev-only: rasterises the real client UI to a PNG for visual checking
# against the PC app mockup. Not shipped.
[[bin]]
name = "ui-shot"
path = "src/bin/ui-shot.rs"

[dependencies]
nb-api.workspace = true
nb-net.workspace = true
nb-render.workspace = true
nb-script.workspace = true
nb-types.workspace = true
nb-world.workspace = true
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
image = { workspace = true, features = ["png"] }
parking_lot.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
