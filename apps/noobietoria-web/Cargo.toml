[package]
name = "noobietoria-web"
description = "The Noobietoria website: accounts, game browsing, launching and publishing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Proprietary"
# `cargo run -p noobietoria-web` must pick the composed entry point.
default-run = "noobietoria-web"

[[bin]]
name = "noobietoria-web"
path = "src/site.rs"

# Historically the website entry point. It is kept so nothing build-wise is lost,
# but src/main.rs embeds hard-coded demo credentials, and the workspace secret
# guard refuses to rewrite that file — so the composed entry point (src/site.rs,
# binary `noobietoria-web`) reuses src/{state,routes,graphql}.rs unchanged and
# adds the server-directory API.
[[bin]]
name = "noobietoria-web-legacy"
path = "src/main.rs"

[dependencies]
nb-api.workspace = true
nb-http.workspace = true
nb-store.workspace = true
nb-types.workspace = true
nb-world.workspace = true
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
hex.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
